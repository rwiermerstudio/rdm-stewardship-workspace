name: Verify illustrative guide
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 prototype/guide.py examples/open-change.json
      - run: python3 prototype/guide.py examples/restricted-derivative.json
      - run: python3 prototype/catalog.py
      - run: python3 prototype/catalog.py oral-heritage
